# =============================================================================
# T-FLEX default configuration (all experiments inherit from this file)
#
# Every numeric value below is an ASSUMED PARAMETER unless its `source` field
# says otherwise. Values marked `source: placeholder` must either be replaced by
# a cited value from published literature or be reported as "assumed parameter"
# in every result that depends on them (see docs/limitations.md).
#
# Units are in the key names (_mhz, _ps, _w, _pj_per_bit, _um, _mm, ...).
# =============================================================================
schema_version: 1
project: T-FLEX
seed: 1                       # master seed; per-component seeds are derived from it

# -----------------------------------------------------------------------------
# Clocks. Each clock is generated by the Verilator C++ harness and can be
# changed at epoch boundaries (link-clock changes go through a retrain).
# -----------------------------------------------------------------------------
clocks:
  core_mhz: 1000              # AI accelerator model + CSR domain
  link_mhz: 2000              # per-link clock (one domain per link S/A/B), max level
  mem_mhz: 800                # SRAM / HBM-like memory model domain
  link_levels_mhz: [2000, 1500, 1000, 500]   # thermal controller frequency steps
  freq_change_retrain: true   # a link frequency change forces LTSM RETRAIN

# -----------------------------------------------------------------------------
# D2D link (per direction). Bandwidth at full width:
#   data_lanes * lane_bits * link_mhz = 32 * 8 * 2000e6 = 512 Gb/s = 64 GB/s
# -----------------------------------------------------------------------------
link:
  data_lanes: 32              # logical data lanes (L)
  spare_lanes: 4              # redundant physical lanes (S); physical = L + S
  lane_bits: 8                # bits carried per lane per link-clock cycle
                              # (abstracts the deserialized SERDES word; no UI-level model)
  flit_bits: 256              # must equal data_lanes * lane_bits at full width
  width_modes: [32, 24, 16, 8]   # supported active logical widths (gearbox)
  min_width: 8                # below this the link is declared DOWN
  valid_lane: dedicated       # framing/valid track assumed fault-free (see limitations)
  repair_style: shift         # shift | crossbar  (both synthesized for comparison)

# -----------------------------------------------------------------------------
# D2D adapter (link layer)
# -----------------------------------------------------------------------------
adapter:
  tx_fifo_depth: 64           # flits, async FIFO core->link
  rx_fifo_depth: 64           # flits, async FIFO link->mem / link->core
  retry_depth: 64             # flits held in the go-back-N replay buffer
  seq_bits: 8                 # flit sequence number width (mod 256 > 2*retry_depth)
  max_retry: 3                # replays of the same flit before escalating to RETRAIN
  rx_credits: 64              # initial TX credits; must be <= rx_fifo_depth
  crc:
    width: 16
    poly: 0x1021              # CRC-16/CCITT polynomial; NOT claimed to match UCIe's CRC
    init: 0xFFFF
    coverage_bits: 240        # CRC covers the flit minus the CRC field

# -----------------------------------------------------------------------------
# Sideband (training messages, ACK/NAK, credit return) - assumed reliable
# -----------------------------------------------------------------------------
sideband:
  latency_cycles: 8           # link-clock cycles, one way
  msgs_per_cycle: 1

# -----------------------------------------------------------------------------
# Link training state machine
# -----------------------------------------------------------------------------
training:
  detect_cycles: 64
  lane_check_cycles: 512      # PRBS comparison window per lane
  lane_err_threshold: 1       # >= this many PRBS mismatches marks a lane bad
  prbs_poly: prbs15           # per-lane pattern (x^15 + x^14 + 1), per-lane seed offset
  deskew_marker_period: 64
  max_skew_cycles: 3          # largest lane-to-lane skew the deskew buffer absorbs
  nak_window_flits: 256       # RETRAIN if >= nak_window_limit NAKs within this many received flits
  nak_window_limit: 16        # (catches high BER where no single flit exceeds max_retry)
  fast_width_change: true     # width-only change skips TRAIN/LANE_CHECK (lanes already known good)
  linkdown_retry_cycles: 20000 # LINK_DOWN periodically re-attempts training
  transient_strikes: 2        # lane failing this many LANE_CHECKs is marked permanent

# -----------------------------------------------------------------------------
# Channel model (per topology, overridden in 2p5d.yaml / 3d.yaml)
# -----------------------------------------------------------------------------
channel:
  latency_cycles: 8           # link-clock pipeline stages, TX PHY out -> RX PHY in
  skew_cycles_per_lane: seeded   # "seeded" = random 0..max_skew per lane from seed, or a list

# -----------------------------------------------------------------------------
# Memory models (behavioral; HBM-like model is NOT an HBM protocol model)
# -----------------------------------------------------------------------------
memory:
  sram:
    read_latency_cycles: 4    # mem-clock cycles
    capacity_kib: 4096
  hbm:
    read_latency_cycles: 60   # mem-clock cycles, before bank conflicts
    banks: 16
    bank_busy_cycles: 8
    peak_gbps: 400            # service-rate cap (token bucket), assumed
  data_integrity: signature   # payloads are LFSR(addr, tag); receiver checks, no bulk storage

# -----------------------------------------------------------------------------
# AI accelerator model (descriptor-driven traffic engine)
# -----------------------------------------------------------------------------
accelerator:
  max_outstanding_reads: 32
  desc_fifo_depth: 64
  compute:
    peak_tops: 100            # abstract ops/s scale for the compute-progress model
    coupling: roofline        # compute progress = min(peak, delivered_bytes * intensity)

# -----------------------------------------------------------------------------
# Co-simulation (RTL <-> Python), see docs/cosim_interface.md
# -----------------------------------------------------------------------------
cosim:
  mode: closed_loop           # closed_loop | open_loop (control schedule from file)
  epoch_ns: 10000             # 10 us of RTL time per epoch (20000 cycles at 2 GHz);
                              # time-based because each link has its own, variable clock
  time_scale_k: 100           # 1 RTL epoch represents K x its duration thermally
                              # => 1 ms physical per epoch at default settings
  thermal_warm_start: steady_state_of_mean_power
  transport: stdio_jsonl      # harness stdout/stdin, one JSON object per line
  record_dir: results/raw

# -----------------------------------------------------------------------------
# Thermal controller (experimental thresholds, NOT hardware limits)
# -----------------------------------------------------------------------------
thermal_control:
  enabled: false
  sensor: tile_max            # which temperature the policy reads per link
  t1_c: 70.0                  # >= T1: reduce link frequency one level
  t2_c: 85.0                  # >= T2: reduce lane width one mode
  t3_c: 95.0                  # >= T3: emergency throttle (injection gated)
  hysteresis_c: 3.0
  min_dwell_epochs: 5         # anti-chatter
  hw_trip_c: 100.0            # RTL comparator backstop, acts without software
  injection_levels: [1.0, 0.75, 0.5, 0.25]
  order: [frequency, width, injection]   # ablation: permute this

# -----------------------------------------------------------------------------
# Routing between AI and HBM (Link A / Link B); SRAM uses Link S only
# -----------------------------------------------------------------------------
routing:
  policy: static              # static | threshold | cost
  static_path: A
  threshold_c: 80.0
  cost_weights: {alpha_latency: 1.0, beta_congestion: 1.0, gamma_temperature: 1.0, delta_fault: 1.0}
  normalization: {latency_ns: 100.0, temperature_c: 100.0}   # cost terms are normalized
  switch_granularity: packet  # path changes only at packet boundaries
  split: winner_take_all      # winner_take_all | weighted (weights from softmax of -cost)

# -----------------------------------------------------------------------------
# Fault model
# -----------------------------------------------------------------------------
faults:
  schedule: none              # none | file path | thermal_model
  thermal_model:              # HYPOTHETICAL temperature dependence, for "what if" studies only
    form: arrhenius
    ea_ev: 0.7                # source: placeholder
    base_lane_fail_per_s: 1.0e-3   # at t_ref_c; source: placeholder (inflated for observability)
    t_ref_c: 60.0
    transient_ber_ref: 1.0e-12
    transient_ber_decade_per_c: 20.0   # BER x10 every 20 C; source: placeholder

# -----------------------------------------------------------------------------
# Power model (architectural; NOT signoff power)
# -----------------------------------------------------------------------------
power:
  model: event_energy         # event_energy | activity_calibrated
  ai:
    static_w: 8.0             # source: placeholder
    compute_peak_w: 60.0      # at 100% compute utilization; source: placeholder
    leakage_temp_coeff_per_c: 0.0    # 0 disables leakage-temperature feedback
  phy:                        # per direction, per lane
    lane_static_mw: 2.0       # source: placeholder
    energy_pj_per_bit: 0.5    # overridden per topology; source: placeholder
  adapter:
    static_mw: 20.0           # source: placeholder
    energy_pj_per_flit: 5.0   # source: placeholder
    retry_energy_pj_per_flit: 5.0
  sram:
    static_w: 0.5             # source: placeholder
    energy_pj_per_byte: 1.0   # source: placeholder
  hbm:
    static_w: 3.0             # source: placeholder
    energy_pj_per_bit: 4.0    # source: placeholder
  base_die:
    static_w: 2.0             # source: placeholder
  voltage_v: 0.75
  freq_voltage_scaling: false # true => V scales with link frequency (DVFS); default frequency-only

# -----------------------------------------------------------------------------
# Thermal model - geometry/material derived RC network (see docs/thermal_model.md)
# -----------------------------------------------------------------------------
thermal:
  ambient_c: 45.0             # inside-chassis air temperature; assumed
  integrator: zoh_expm        # zoh_expm (exact for piecewise-constant power) | backward_euler
  tiles_per_die: [4, 4]       # compact grid per die; [1, 1] reproduces the lumped model
  materials:                  # approximate textbook bulk values; assumed, temperature-independent
    silicon:  {k_w_mk: 130.0, cv_j_m3k: 1.63e6}
    copper:   {k_w_mk: 400.0, cv_j_m3k: 3.45e6}
    tim:      {k_w_mk: 4.0,   cv_j_m3k: 2.0e6}
    underfill_bumps: {k_w_mk: 1.5, cv_j_m3k: 2.0e6}   # effective, bump+underfill layer
    hybrid_bond:     {k_w_mk: 1.5, cv_j_m3k: 2.0e6}   # effective; swept in sensitivity study
  heatsink:
    r_k_w: 0.2                # heatsink + TIM2 to ambient
    c_j_k: 150.0
  secondary_path_r_k_w: 5.0   # die/interposer -> substrate -> board -> ambient, lumped

# -----------------------------------------------------------------------------
# Synthesis (pre-layout estimates only)
# -----------------------------------------------------------------------------
synthesis:
  frontend: sv2v              # Yosys 0.33 native SV parser rejects some constructs we use
  liberty: nangate45_typical  # fetched by scripts/fetch_liberty.sh; sky130hd as alternate
  also_fpga: xilinx7          # LUT/FF counts via synth_xilinx (no timing)
